<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Virtual Q Detector</title>
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <div class="stage">
    <div class="island" id="island" data-status="watching">
      <div class="glass-sheen"></div>
      <div class="glass-shine"></div>

      <!-- Collapsed State: Sleek Apple-style Dynamic Island pill -->
      <div class="collapsed-bar" id="collapsedBar">
        <span class="status-indicator">
          <span class="dot-core"></span>
          <span class="dot-ring"></span>
        </span>
        <span class="collapsed-title" id="collapsedTitle">Watching</span>
        <span class="collapsed-sep">·</span>
        <span class="collapsed-time" id="collapsedTime">--:--</span>
      </div>

      <!-- Expanded State: Spacious, de-congested, professional card -->
      <div class="panel">
        <header class="reveal d1">
          <div class="titles">
            <div class="title">Sabarimala Virtual Q</div>
            <div class="sub" id="sub">Watching Dec 20–22 · 6+ slots</div>
          </div>
          <div class="status-badge" id="pill">
            <span class="status-indicator">
              <span class="dot-core"></span>
              <span class="dot-ring"></span>
            </span>
            <span class="status-text" id="statusLbl">Watching</span>
          </div>
        </header>

        <div class="status-card reveal d2">
          <div class="msg" id="msg">Starting watcher...</div>
          <div class="telemetry">
            <div class="tel-item">
              <span class="tel-label">Next check</span>
              <span class="tel-val highlight" id="next">--:--</span>
            </div>
            <span class="tel-divider"></span>
            <div class="tel-item">
              <span class="tel-label">Last checked</span>
              <span class="tel-val" id="last">--:--</span>
            </div>
            <span class="tel-divider"></span>
            <div class="tel-item">
              <span class="tel-label">Checks</span>
              <span class="tel-val" id="checks">0</span>
            </div>
            <span class="tel-divider"></span>
            <div class="tel-item">
              <span class="tel-label">Channels</span>
              <span class="tel-val" id="chan">1</span>
            </div>
          </div>
        </div>

        <div class="chips-container reveal d3">
          <div class="chips" id="chips"></div>
        </div>

        <div class="actions reveal d4">
          <button class="btn btn-secondary" data-act="check" title="Check now">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
            <span>Check</span>
          </button>
          <button class="btn btn-secondary" data-act="pause" id="pauseBtn" title="Pause or resume">
            <svg viewBox="0 0 24 24" id="pauseIcon"><path d="M9 6v12M15 6v12"/></svg>
            <span id="pauseLbl">Pause</span>
          </button>
          <button class="btn btn-secondary" data-act="login" id="loginBtn" title="Log in to booking portal">
            <svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l4 4-4 4M14 12H4"/></svg>
            <span>Log in</span>
          </button>
          <button class="btn btn-secondary" data-act="settings" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
            <span>Settings</span>
          </button>
          <button class="btn btn-primary" data-act="site" id="bookBtn" title="Open the booking site">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
            <span>Book</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="island.js"></script>
</body>
</html>
